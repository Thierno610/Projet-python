<!-- Floating Chatbox Component: Neural Relay -->
<div id="chatbox-wrapper" class="position-fixed bottom-0 end-0 p-4" style="z-index: 2000;">
    <!-- Neural Link Toggle -->
    <button id="chatbox-toggle"
        class="btn btn-indigo rounded-circle d-flex align-items-center justify-content-center shadow-glow transition-premium"
        style="width: 60px; height: 60px; border: 2px solid rgba(255,255,255,0.15); background: var(--primary-indigo-glow);">
        <i class="fas fa-brain fs-4 text-white"></i>
        <div class="position-absolute top-0 start-0 w-100 h-100 rounded-circle animate-ping opacity-20 bg-indigo"></div>
    </button>

    <!-- Neural Relay Window -->
    <div id="chatbox-window" class="glass-card d-none flex-column overflow-hidden shadow-2xl border-indigo-glow"
        style="width: 380px; height: 550px; bottom: 90px; right: 20px; position: absolute; background: rgba(12, 12, 14, 0.95); backdrop-filter: blur(20px);">
        <!-- Header: Relay Status -->
        <div class="p-4 border-bottom border-slate bg-white-5 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-indigo-glow p-2 rounded-circle border-indigo-glow">
                    <div class="pulse-dot bg-indigo" style="width: 8px; height: 8px;"></div>
                </div>
                <div>
                    <span class="x-small text-white fw-800 tracking-widest text-uppercase d-block">Relais_Neural</span>
                    <span class="x-small text-indigo font-monospace opacity-75">ID: GUIDA_v4.8</span>
                </div>
            </div>
            <button id="chatbox-close"
                class="btn btn-outline-slate btn-sm border-0 rounded-circle p-2 opacity-50 hover-100">
                <i class="fas fa-times x-small"></i>
            </button>
        </div>

        <!-- Messages Area: Nexus Stream -->
        <div id="chatbox-messages" class="flex-grow-1 p-4 overflow-auto d-flex flex-column gap-3"
            style="background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.03), transparent);">
            <!-- Neural nodes load here -->
        </div>

        <!-- Footer / Neural Input -->
        <div class="p-4 border-top border-slate bg-white-5">
            <div class="input-group bg-black-20 rounded-pill p-1 border-slate focus-within-indigo shadow-inner">
                <input type="text" id="chatbox-input"
                    class="form-control border-0 bg-transparent text-white x-small font-monospace ps-3"
                    placeholder="TRANSMETTRE_REQUÊTE...">
                <button id="chatbox-send" class="btn btn-indigo rounded-circle p-2 ms-1"
                    style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-paper-plane x-small"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    #chatbox-window {
        display: none;
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        transform: translateY(30px) scale(0.95);
        opacity: 0;
    }

    #chatbox-window.active {
        display: flex !important;
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    .chat-bubble {
        padding: 12px 16px;
        border-radius: 16px;
        max-width: 85%;
        font-size: 0.8rem;
        line-height: 1.5;
        position: relative;
        animation: bubble-in 0.3s ease-out forwards;
    }

    @keyframes bubble-in {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .chat-bubble.ai {
        align-self: flex-start;
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.2);
        color: rgba(255, 255, 255, 0.9);
        border-bottom-left-radius: 4px;
    }

    .chat-bubble.user {
        align-self: flex-end;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        border-bottom-right-radius: 4px;
        font-family: var(--font-mono);
        letter-spacing: -0.01em;
    }

    .chat-bubble.thinking {
        background: transparent;
        border: none;
        padding: 4px 8px;
    }

    #chatbox-messages::-webkit-scrollbar {
        width: 3px;
    }

    #chatbox-messages::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.2);
        border-radius: 10px;
    }

    .typing-node {
        display: flex;
        gap: 6px;
    }

    .typing-node span {
        width: 6px;
        height: 6px;
        background: var(--primary-indigo);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--primary-indigo);
        animation: node-pulse 1.5s infinite;
    }

    .typing-node span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-node span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes node-pulse {

        0%,
        100% {
            opacity: 0.3;
            transform: scale(0.8);
        }

        50% {
            opacity: 1;
            transform: scale(1.2);
        }
    }

    .animate-ping {
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {

        75%,
        100% {
            transform: scale(1.5);
            opacity: 0;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggle = document.getElementById('chatbox-toggle');
        const chatWindow = document.getElementById('chatbox-window');
        const close = document.getElementById('chatbox-close');
        const input = document.getElementById('chatbox-input');
        const send = document.getElementById('chatbox-send');
        const messagesArea = document.getElementById('chatbox-messages');
        let greetingLoaded = false;

        toggle.addEventListener('click', async () => {
            const isActive = chatWindow.classList.toggle('active');
            if (isActive && !greetingLoaded) {
                loadGreeting();
            }
            if (isActive) {
                input.focus();
            }
        });

        close.addEventListener('click', () => {
            chatWindow.classList.remove('active');
        });

        function addBubble(text, type) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${type}`;
            bubble.innerHTML = text;
            messagesArea.appendChild(bubble);
            messagesArea.scrollTop = messagesArea.scrollHeight;
            return bubble;
        }

        async function loadGreeting() {
            try {
                messagesArea.innerHTML = '';
                const typingNode = addBubble('<div class="typing-node"><span></span><span></span><span></span></div>', 'thinking');

                const response = await fetch('/api/chat/start');
                const data = await response.json();

                typingNode.remove();
                addBubble(data.reply || "Lien neural établi. Comment SafeDoc peut-il traiter votre requête ?", 'ai');
                greetingLoaded = true;
            } catch (err) {
                console.error("Link Failure:", err);
            }
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addBubble(text, 'user');
            input.value = '';
            input.disabled = true;
            send.disabled = true;

            const typingNode = addBubble('<div class="typing-node"><span></span><span></span><span></span></div>', 'thinking');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();

                typingNode.remove();
                if (data.reply) {
                    addBubble(data.reply, 'ai');
                } else {
                    addBubble("ERREUR_SYNTAXE : Échec de récupération de la réponse.", 'ai');
                }
            } catch (err) {
                if (typingNode) typingNode.remove();
                addBubble("PERTE_LIEN : Assistant hors ligne.", 'ai');
            } finally {
                input.disabled = false;
                send.disabled = false;
                input.focus();
            }
        }

        send.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    });
</script>
