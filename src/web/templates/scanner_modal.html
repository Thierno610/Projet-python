<!-- Scanner Modal Component: Optical Ingress -->
<div class="modal fade" id="scannerModal" tabindex="-1" aria-labelledby="scannerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content glass-card border-indigo-glow overflow-hidden"
            style="background: rgba(12, 12, 14, 0.98);">
            <!-- Header: Ingress Status -->
            <div class="modal-header border-slate bg-white-5 p-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-indigo-glow p-2 rounded-circle border-indigo-glow">
                        <i class="fas fa-aperture text-indigo animate-spin-slow"></i>
                    </div>
                    <div>
                        <h5 class="modal-title x-small text-white fw-800 tracking-widest text-uppercase mb-0"
                            id="scannerModalLabel">
                            Nœud_d'Entrée_Optique
                        </h5>
                        <span class="x-small text-indigo font-monospace opacity-75">MATÉRIEL :
                            LENTILLE_INTÉGRÉE_v2</span>
                    </div>
                </div>
                <button type="button"
                    class="btn btn-outline-slate btn-sm border-0 rounded-circle p-2 opacity-50 hover-100"
                    data-bs-dismiss="modal" aria-label="Close">
                    <i class="fas fa-times x-small"></i>
                </button>
            </div>

            <!-- Viewport: Neural Stream -->
            <div class="modal-body p-0 position-relative overflow-hidden" style="background: #000; min-height: 450px;">
                <!-- Camera Viewport -->
                <video id="scannerVideo" autoplay playsinline class="w-100 h-100"
                    style="object-fit: cover; filter: contrast(1.1) brightness(1.1);"></video>

                <!-- Scanning Matrix Overlay -->
                <div
                    class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center pointer-events-none">
                    <!-- Vignette & HUD -->
                    <div class="position-absolute top-0 start-0 w-100 h-100 shadow-inner"
                        style="box-shadow: inset 0 0 150px rgba(0,0,0,0.8);"></div>

                    <div class="scanner-frame d-flex align-items-center justify-content-center"
                        style="width: 85%; height: 75%; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4);">

                        <!-- UI Corners -->
                        <div class="position-absolute top-0 start-0 p-3">
                            <div
                                style="width: 20px; height: 20px; border-top: 2px solid var(--primary-indigo); border-left: 2px solid var(--primary-indigo); border-radius: 4px 0 0 0;">
                            </div>
                        </div>
                        <div class="position-absolute top-0 end-0 p-3">
                            <div
                                style="width: 20px; height: 20px; border-top: 2px solid var(--primary-indigo); border-right: 2px solid var(--primary-indigo); border-radius: 0 4px 0 0;">
                            </div>
                        </div>
                        <div class="position-absolute bottom-0 start-0 p-3">
                            <div
                                style="width: 20px; height: 20px; border-bottom: 2px solid var(--primary-indigo); border-left: 2px solid var(--primary-indigo); border-radius: 0 0 0 4px;">
                            </div>
                        </div>
                        <div class="position-absolute bottom-0 end-0 p-3">
                            <div
                                style="width: 20px; height: 20px; border-bottom: 2px solid var(--primary-indigo); border-right: 2px solid var(--primary-indigo); border-radius: 0 0 4px 0;">
                            </div>
                        </div>

                        <div class="scanner-laser"></div>

                        <!-- HUD Text -->
                        <div class="position-absolute top-0 start-50 translate-middle-x mt-4">
                            <span
                                class="x-small text-white-50 font-monospace tracking-widest bg-black-20 px-3 py-1 rounded-pill border-slate">ALIGNER_LA_CIBLE_DANS_LES_LIMITES</span>
                        </div>
                    </div>
                </div>

                <!-- Live Feed Badge -->
                <div class="position-absolute top-0 end-0 p-4">
                    <span
                        class="badge border-indigo-glow bg-indigo-glow text-white x-small font-monospace tracking-widest px-3 py-2">
                        <i class="fas fa-broadcast-tower me-2 animate-pulse"></i>FLUX_EN_DIRECT_SYNCHRONISÉ
                    </span>
                </div>
            </div>

            <!-- Footer: Controls -->
            <div class="modal-footer border-slate bg-white-5 justify-content-center py-4">
                <button type="button" id="captureBtn"
                    class="btn btn-indigo btn-lg px-5 rounded-pill fw-800 tracking-widest shadow-glow">
                    <i class="fas fa-camera-retro me-2"></i>ACQUÉRIR_TRANCHE_DE_DONNÉES
                </button>
                <canvas id="scannerCanvas" class="d-none"></canvas>
            </div>
        </div>
    </div>
</div>

<style>
    .scanner-frame {
        position: relative;
        overflow: hidden;
    }

    .scanner-laser {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--primary-indigo);
        box-shadow: 0 0 20px 2px var(--primary-indigo);
        z-index: 10;
        animation: scanMove 3s infinite cubic-bezier(0.445, 0.05, 0.55, 0.95);
    }

    @keyframes scanMove {

        0%,
        100% {
            top: 0%;
            opacity: 0;
        }

        10%,
        90% {
            opacity: 1;
        }

        50% {
            top: 98%;
        }
    }

    .animate-spin-slow {
        animation: spin 8s linear infinite;
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const scannerModal = document.getElementById('scannerModal');
        const video = document.getElementById('scannerVideo');
        const canvas = document.getElementById('scannerCanvas');
        const captureBtn = document.getElementById('captureBtn');
        let stream = null;

        scannerModal.addEventListener('shown.bs.modal', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 30 }
                    }
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Optical Error:", err);
                alert("Hardware acquisition failed: Camera access denied.");
                bootstrap.Modal.getInstance(scannerModal).hide();
            }
        });

        scannerModal.addEventListener('hidden.bs.modal', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        });

        captureBtn.addEventListener('click', () => {
            // Visualiser l'acquisition
            captureBtn.innerHTML = '<i class="fas fa-sync-alt fa-spin me-2"></i>TRAITEMENT...';
            captureBtn.classList.add('opacity-50');

            // Extraction pulse
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

            // Transmit slice
            setTimeout(() => {
                const event = new CustomEvent('documentScanned', { detail: { image: dataUrl } });
                document.dispatchEvent(event);

                captureBtn.innerHTML = '<i class="fas fa-camera-retro me-2"></i>ACQUIRE_DATA_SLICE';
                captureBtn.classList.remove('opacity-50');

                bootstrap.Modal.getInstance(scannerModal).hide();
            }, 600);
        });
    });
</script>
